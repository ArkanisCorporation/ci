# Summary:
#   Reusable Docker Buildx workflow that publishes an OCI image from any caller Dockerfile.
# Remarks:
#   This workflow runs in the caller repository context.
#   It performs no language-specific version stamping and modifies no caller files; the release version reaches the
#   Dockerfile only as the version-build-arg Docker build argument (default VERSION).
#   It can use a remote BuildKit endpoint on self-hosted runners.
#   It forwards non-secret Docker build arguments to BuildKit.
#   It logs into the configured registry and may create or overwrite mutable tags.
#   Buildx provenance and SBOM attestations are attached to the pushed image; no OIDC or GitHub attestation permission is used.
#   Use wf-verify-publish-container-generic.yml for build-only verification and wf-publish-container-dotnet.yml for .NET images.
#   Consumers should deploy image digests from the digest output instead of mutable tags.

name: wf-publish-container-generic

on:
  workflow_call:
    inputs:
      runs-on:
        description: Single runner label used when runs-on-json is empty.
        type: string
        required: false
        default: ubuntu-latest
      runs-on-json:
        description: JSON array passed to runs-on, including GitHub-hosted image labels or self-hosted runner labels. Overrides runs-on when set.
        type: string
        required: false
        default: ""
      runs-on-self-hosted:
        description: True when the effective runner selection targets self-hosted runners.
        type: boolean
        required: false
        default: false
      environment-name:
        description: GitHub environment guarding image publication.
        type: string
        required: false
        default: container
      image:
        description: Fully-qualified image name without tag.
        type: string
        required: true
      context:
        description: Docker build context.
        type: string
        required: false
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        required: false
        default: Dockerfile
      target:
        description: Optional Dockerfile target stage.
        type: string
        required: false
        default: ""
      platforms:
        description: Comma-delimited target platforms.
        type: string
        required: false
        default: linux/amd64
      version:
        description: Required bare version without leading v, passed to the Dockerfile through the version-build-arg Docker build argument.
        type: string
        required: true
      version-build-arg:
        description: Docker build argument name that receives version. Empty disables it. A same-named entry in build-args wins.
        type: string
        required: false
        default: VERSION
      version-tag:
        description: Optional release version tag to apply to the image, usually prefixed with v.
        type: string
        required: false
        default: ""
      version-channel:
        description: Optional channel tag to apply.
        type: string
        required: false
        default: ""
      channel-latest:
        description: Adds a mutable <version-channel>-latest tag when version-channel is set.
        type: boolean
        required: false
        default: true
      extra-tags:
        description: Optional newline-delimited extra image tags. Bare tags expand as image:tag; full image references pass through.
        type: string
        required: false
        default: ""
      registry:
        description: Registry host used for docker/login-action.
        type: string
        required: false
        default: ghcr.io
      registry-username:
        description: Registry username; defaults to github.actor when empty.
        type: string
        required: false
        default: ""
      buildkit-endpoint:
        description: Optional remote BuildKit endpoint for self-hosted runners. When empty on a self-hosted runner, the runner's BUILDKIT_HOST environment variable is used if set; otherwise a local builder is created.
        type: string
        required: false
        default: ""
      build-args:
        description: Optional newline-delimited Docker build arguments. Do not pass secrets here because Docker build args can persist in image metadata or logs.
        type: string
        required: false
        default: ""
      enable-cache:
        description: Enables the generated GitHub Actions BuildKit cache when cache-from and cache-to are empty.
        type: boolean
        required: false
        default: true
      cache-from:
        description: Optional Docker Buildx cache-from value. Overrides the generated GitHub Actions cache when set.
        type: string
        required: false
        default: ""
      cache-to:
        description: Optional Docker Buildx cache-to value. Overrides the generated GitHub Actions cache when set.
        type: string
        required: false
        default: ""
      sbom:
        description: Docker Buildx sbom input.
        type: string
        required: false
        default: "true"
      provenance:
        description: Docker Buildx provenance input.
        type: string
        required: false
        default: mode=max
      labels:
        description: Optional newline-delimited OCI labels.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: Publish job timeout.
        type: number
        required: false
        default: 45
      artifact-retention-days:
        description: Metadata artifact retention in days.
        type: number
        required: false
        default: 30
      upload-diagnostics:
        description: Uploads the image metadata artifact when true. The upload is best-effort and never fails the job.
        type: boolean
        required: false
        default: true
    secrets:
      REGISTRY_TOKEN:
        description: Registry token; defaults to github.token when omitted.
        required: false
    outputs:
      digest:
        description: Image digest produced by docker/build-push-action.
        value: ${{ jobs.publish.outputs.digest }}
      metadata:
        description: Publish metadata JSON produced by docker/build-push-action.
        value: ${{ jobs.publish.outputs.metadata }}
      artifact-manifest:
        description: Path to the generated artifact manifest.
        value: ${{ jobs.publish.outputs.artifact-manifest }}

permissions: {}

jobs:
  publish:
    name: ${{ inputs.version || inputs.version-tag }} @ ${{ inputs.environment-name }}
    runs-on: ${{ fromJSON(inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest'))) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: publish-container-generic-${{ inputs.environment-name }}-${{ inputs.registry }}-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.build.outputs.metadata }}
      artifact-manifest: ${{ steps.manifest.outputs.path }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout caller @ ${{ github.repository }}:${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate runner contract @ ${{ inputs.runs-on-json || inputs.runs-on || 'ubuntu-latest' }}
        env:
          RUNS_ON_SELF_HOSTED: ${{ inputs.runs-on-self-hosted }}
          RUNS_ON_JSON: ${{ inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest')) }}
          BUILDKIT_ENDPOINT: ${{ inputs.buildkit-endpoint }}
          ENABLE_CACHE: ${{ inputs.enable-cache }}
        run: |
          mkdir -p artifacts/container artifacts/meta
          {
            echo "Runs on self-hosted: ${RUNS_ON_SELF_HOSTED}"
            echo "Requested runner labels: ${RUNS_ON_JSON}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner arch: ${RUNNER_ARCH}"
            echo "BuildKit endpoint input set: $([[ -n "$BUILDKIT_ENDPOINT" ]] && echo true || echo false)"
            echo "BuildKit cache enabled: ${ENABLE_CACHE}"
            echo "Language version stamping: none"
          } | tee artifacts/meta/runner-contract.txt

      - name: Validate container publish inputs @ ${{ inputs.image }}:${{ inputs.version || inputs.version-tag }}
        env:
          VERSION: ${{ inputs.version }}
          VERSION_BUILD_ARG: ${{ inputs.version-build-arg }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "version is required for container publishing." >&2
            exit 2
          fi

          if [[ "$VERSION" =~ ^[vV] ]]; then
            echo "version must be a bare semantic version without leading v. Use version-tag for Docker tags." >&2
            exit 2
          fi

          if [[ -n "$VERSION_BUILD_ARG" && ! "$VERSION_BUILD_ARG" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "version-build-arg must be a Docker build argument name ([A-Za-z_][A-Za-z0-9_]*) or empty." >&2
            exit 2
          fi

      - name: Self-hosted preflight @ ${{ inputs.runs-on-json || inputs.runs-on || 'ubuntu-latest' }}
        if: inputs.runs-on-self-hosted
        run: |
          {
            echo "## Self-hosted runner preflight"
            echo
            df -h .
            echo
            command -v docker
            docker version
          } | tee artifacts/meta/self-hosted-preflight.txt

      - name: Resolve BuildKit endpoint
        id: buildkit
        env:
          BUILDKIT_ENDPOINT_INPUT: ${{ inputs.buildkit-endpoint }}
          RUNS_ON_SELF_HOSTED: ${{ inputs.runs-on-self-hosted }}
        run: |
          # An explicit buildkit-endpoint input always wins. Otherwise a self-hosted runner may
          # advertise a shared builder through BUILDKIT_HOST in its own environment (daedalus:
          # ci-runners' bounded buildkitd). Read from the shell: the `env` expression context does
          # not include the runner process environment. Hosted runners never consult it.
          endpoint="$BUILDKIT_ENDPOINT_INPUT"
          origin=input
          if [[ -z "$endpoint" ]]; then
            origin=none
            if [[ "$RUNS_ON_SELF_HOSTED" == "true" && -n "${BUILDKIT_HOST:-}" ]]; then
              endpoint="$BUILDKIT_HOST"
              origin=runner
            fi
          fi
          # An endpoint never legitimately spans lines; fail loudly rather than hand buildx a
          # malformed address. The value is not echoed, only where it came from.
          if [[ "$endpoint" == *$'\n'* || "$endpoint" == *$'\r'* ]]; then
            echo "::error::Resolved BuildKit endpoint (source: ${origin}) contains a line break."
            exit 2
          fi
          echo "Remote BuildKit endpoint source: ${origin}" | tee -a artifacts/meta/runner-contract.txt
          {
            echo "endpoint<<ENDPOINT"
            printf '%s\n' "$endpoint"
            echo "ENDPOINT"
            echo "origin<<ORIGIN"
            printf '%s\n' "$origin"
            echo "ORIGIN"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx @ local
        if: steps.buildkit.outputs.endpoint == ''
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx @ remote
        if: steps.buildkit.outputs.endpoint != ''
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit.outputs.endpoint }}

      - name: Resolve image tags @ ${{ inputs.image }}:${{ inputs.version || inputs.version-tag }}
        id: tags
        env:
          IMAGE: ${{ inputs.image }}
          VERSION_TAG: ${{ inputs.version-tag }}
          VERSION_CHANNEL: ${{ inputs.version-channel }}
          CHANNEL_LATEST: ${{ inputs.channel-latest }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          {
            echo "tags<<TAGS"
            echo "${IMAGE}:sha-${short_sha}"
            if [[ -n "$VERSION_TAG" ]]; then
              echo "${IMAGE}:${VERSION_TAG}"
            fi
            if [[ -n "$VERSION_CHANNEL" ]]; then
              echo "${IMAGE}:${VERSION_CHANNEL}"
              if [[ "$CHANNEL_LATEST" == "true" ]]; then
                echo "${IMAGE}:${VERSION_CHANNEL}-latest"
              fi
            fi
            while IFS= read -r extra_tag; do
              extra_tag="${extra_tag#"${extra_tag%%[![:space:]]*}"}"
              extra_tag="${extra_tag%"${extra_tag##*[![:space:]]}"}"
              if [[ -z "$extra_tag" ]]; then
                continue
              fi
              if [[ "$extra_tag" == *"/"* ]]; then
                echo "$extra_tag"
              else
                echo "${IMAGE}:${extra_tag}"
              fi
            done <<< "$EXTRA_TAGS"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Docker build args @ ${{ inputs.version-build-arg || 'no version arg' }}=${{ inputs.version }}
        id: build-args
        env:
          VERSION: ${{ inputs.version }}
          VERSION_BUILD_ARG: ${{ inputs.version-build-arg }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          # The release version reaches the image only through this build argument; the Dockerfile
          # decides how to stamp it (for Rust, typically ARG VERSION -> ENV APP_VERSION before cargo build).
          {
            echo "value<<BUILD_ARGS"
            if [[ -n "$BUILD_ARGS" ]]; then
              printf '%s\n' "$BUILD_ARGS"
            fi
            if [[ -n "$VERSION_BUILD_ARG" ]] && ! grep -Eq "(^|[[:space:]])${VERSION_BUILD_ARG}=" <<< "$BUILD_ARGS"; then
              printf '%s=%s\n' "$VERSION_BUILD_ARG" "$VERSION"
            fi
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Docker Buildx cache @ ${{ inputs.image }}
        id: build-cache
        env:
          ENABLE_CACHE: ${{ inputs.enable-cache }}
          CACHE_FROM: ${{ inputs.cache-from }}
          CACHE_TO: ${{ inputs.cache-to }}
          BUILDKIT_ENDPOINT_RESOLVED: ${{ steps.buildkit.outputs.endpoint }}
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          mkdir -p artifacts/meta

          slug() {
            local value="$1"
            value="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
            value="${value:0:64}"
            printf '%s' "${value:-default}"
          }

          scope=""
          cache_from=""
          cache_to=""
          cache_to_state="none"

          if [[ "$ENABLE_CACHE" == "true" ]]; then
            if [[ -n "$CACHE_FROM" || -n "$CACHE_TO" ]]; then
              cache_from="$CACHE_FROM"
              cache_to="$CACHE_TO"
            else
              scope="container-$(slug "$IMAGE")-$(slug "$CONTEXT")-$(slug "$DOCKERFILE")-$(slug "$PLATFORMS")"
              cache_from="type=gha,scope=${scope}"
              # A runner-advertised BuildKit (ARK-529) is shared and long-lived: it keeps the layer
              # cache on the runner host between jobs, so exporting the same layers to the Actions
              # cache buys nothing - and it breaks builds. `type=gha` reserves one cache entry per
              # layer blob, keyed by blob digest, git ref and repository; the buildx `scope=` above
              # is NOT part of that key. Matrix jobs of one workflow share base layers, and now that
              # they also share a warm builder they reach the export phase at the same moment, so
              # two of them reserve the same key concurrently. The loser is told the reservation is
              # taken, which BuildKit's Cache Service v2 client reports as `failed to reserve cache`
              # and - unlike its v1 path, which treats the conflict as "blob already there" and
              # moves on - turns into a failed build. Import stays on: reads never reserve.
              if [[ -n "$BUILDKIT_ENDPOINT_RESOLVED" ]]; then
                cache_to_state="skipped (shared BuildKit keeps the layer cache)"
              else
                cache_to="type=gha,scope=${scope},mode=max"
              fi
            fi
          fi

          if [[ -n "$cache_to" ]]; then
            cache_to_state="configured"
          fi

          {
            echo "BuildKit cache enabled: ${ENABLE_CACHE}"
            echo "Default cache scope: ${scope:-none}"
            echo "Cache from: $([[ -n "$cache_from" ]] && echo configured || echo none)"
            echo "Cache to: ${cache_to_state}"
          } | tee artifacts/meta/docker-cache.txt

          {
            echo "cache_from<<CACHE_FROM"
            printf '%s\n' "$cache_from"
            echo "CACHE_FROM"
            echo "cache_to<<CACHE_TO"
            printf '%s\n' "$cache_to"
            echo "CACHE_TO"
            echo "scope=${scope}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registry @ ${{ inputs.registry }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || github.token }}
          logout: true

      - name: Publish image ${{ inputs.image }} @ ${{ inputs.platforms }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ inputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          target: ${{ inputs.target }}
          cache-from: ${{ steps.build-cache.outputs.cache_from }}
          cache-to: ${{ steps.build-cache.outputs.cache_to }}
          sbom: ${{ inputs.sbom }}
          provenance: ${{ inputs.provenance }}

      - name: Write image metadata @ ${{ steps.build.outputs.digest || inputs.image }}
        id: manifest
        if: always()
        env:
          RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
          DIGEST: ${{ steps.build.outputs.digest }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          mkdir -p artifacts/container
          printf '%s\n' "$DIGEST" > artifacts/container/digest.txt
          printf '%s\n' "$METADATA" > artifacts/container/build-metadata.json
          cat > artifacts/artifact-manifest.json <<JSON
          {
            "schema": "ci-artifact-manifest/v1",
            "producer": {
              "repository": "${GITHUB_REPOSITORY}",
              "workflow": "wf-publish-container-generic",
              "run_id": "${GITHUB_RUN_ID}",
              "run_attempt": "${GITHUB_RUN_ATTEMPT}",
              "sha": "${GITHUB_SHA}",
              "job": "publish"
            },
            "artifacts": [
              {
                "name": "${GITHUB_REPOSITORY#*/}-container-generic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
                "kind": "image-metadata",
                "paths": ["artifacts/container"],
                "retention_days": ${RETENTION_DAYS}
              }
            ]
          }
          JSON
          echo "path=artifacts/artifact-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Publish summary @ ${{ steps.build.outputs.digest || inputs.image }}
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          VERSION_CHANNEL: ${{ inputs.version-channel }}
          CHANNEL_LATEST: ${{ inputs.channel-latest }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
          VERSION_BUILD_ARG: ${{ inputs.version-build-arg }}
          CACHE_SCOPE: ${{ steps.build-cache.outputs.scope }}
        run: |
          {
            echo "# Container publishing"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runs on self-hosted | \`${{ inputs.runs-on-self-hosted }}\` |"
            echo "| Runner labels | \`${{ inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest')) }}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Environment | \`${{ inputs.environment-name }}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Version build arg | \`${VERSION_BUILD_ARG:-none}\` |"
            echo "| Version channel | \`${VERSION_CHANNEL:-none}\` |"
            echo "| Channel latest | \`${CHANNEL_LATEST}\` |"
            echo "| Extra tags | \`${EXTRA_TAGS:-none}\` |"
            echo "| BuildKit cache | \`${{ inputs.enable-cache }}\` |"
            echo "| BuildKit cache scope | \`${CACHE_SCOPE:-none}\` |"
            echo "| BuildKit endpoint source | \`${{ steps.buildkit.outputs.origin }}\` |"
            echo "| Digest | \`${DIGEST:-none}\` |"
            echo "| Manifest | \`${{ steps.manifest.outputs.path }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container metadata @ ${{ github.event.repository.name }}-container-generic-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ always() && inputs.upload-diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-container-generic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts
            ${{ runner.debug != '1' && '!artifacts/**/bin/**' || '' }}
            ${{ runner.debug != '1' && '!artifacts/**/obj/**' || '' }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}
