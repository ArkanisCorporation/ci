# Summary:
#   Reusable Aspire Kubernetes deployment workflow.
# Remarks:
#   This workflow runs in the caller repository context.
#   It assumes the runner already has cluster network access and either a current kube context or a KUBE_CONFIG secret.
#   It logs into GHCR before checkout and tool setup so Aspire can push or pull registry content during deployment.
#   It creates the target namespace when missing and then runs `dotnet tool run aspire -- deploy`.
#   Aspire runs `helm upgrade --install --wait` with a closed argument list: no --timeout, no rollback (ARK-744).
#   The helm-release-guard action therefore records the release before the deploy, recovers a release a cancelled
#   run left pending, and afterwards verifies the rollout or collects diagnostics and rolls the release back.
#   A helm shim on PATH for the deploy step alone supplies the --timeout Aspire does not set.
#   A failed deploy always fails the job, whether or not the rollback restored the environment.
#   exclusive: true stops every Deployment of the release before the deploy (downtime) and exports
#   ARKANIS_DEPLOY_EXCLUSIVE=true into the deploy step alone, so the AppHost may allow a breaking migration.
#   After a verified deployment, and only then, the guard runs the chart's schema-confirm CronJob as a Job once no
#   object in the namespace still carries an older release's images (ARK-746): the consumer's migrator may then apply
#   contract migrations. A blocked confirm is a warning; a failed one fails the job but rolls nothing back.
#   Use wf-verify-deploy-k8s-aspire.yml for deployment input verification without cluster mutation.
#   It calls runs-on/cache for NuGet only when enable-cache is true and the runner does not advertise a
#   persistent NuGet folder (ARKANIS_PERSISTENT_NUGET_PACKAGES=true, ARK-528).

name: wf-deploy-k8s-aspire

on:
  workflow_call:
    inputs:
      runs-on:
        description: Single runner label used when runs-on-json is empty.
        type: string
        required: false
        default: ubuntu-latest
      runs-on-json:
        description: JSON array passed to runs-on, including GitHub-hosted image labels or self-hosted runner labels. Overrides runs-on when set.
        type: string
        required: false
        default: ""
      runs-on-self-hosted:
        description: True when the effective runner selection targets self-hosted runners.
        type: boolean
        required: false
        default: false
      environment-name:
        description: GitHub environment guarding deployment.
        type: string
        required: true
      aspire-environment:
        description: Aspire deployment environment.
        type: string
        required: true
      kubernetes-namespace:
        description: Kubernetes namespace receiving the deployment.
        type: string
        required: true
      apphost-project:
        description: Aspire AppHost project path.
        type: string
        required: true
      output-path:
        description: Aspire deploy output path.
        type: string
        required: false
        default: artifacts/k8s
      source-ref:
        description: Optional caller repository checkout ref; empty preserves the triggering commit. Callers must authorize the selected source before deployment.
        type: string
        required: false
        default: ""
      image-tag:
        description: Optional Kubernetes:Images:Tag override.
        type: string
        required: false
        default: ""
      dotnet-version:
        description: .NET SDK version range.
        type: string
        required: false
        default: 10.0.x
      global-json-file:
        description: Optional global.json path passed to actions/setup-dotnet.
        type: string
        required: false
        default: ""
      github-packages-auth:
        description: Use the job-scoped GitHub token for caller-owner GitHub Packages sources in NuGet.Config.
        type: boolean
        required: false
        default: false
      nuget-source-config-path:
        description: Optional caller NuGet.Config path when it is not in the repository root.
        type: string
        required: false
        default: ""
      enable-cache:
        description: Restores and saves NuGet dependency cache with runs-on/cache when true. Set false for cold-deploy validation or runners without cache service access.
        type: boolean
        required: false
        default: true
      kubectl-version:
        description: kubectl version installed before deployment.
        type: string
        required: false
        default: v1.36.2
      helm-version:
        description: Helm version installed before deployment.
        type: string
        required: false
        default: v4.2.2
      helm-release-name:
        description: Helm release the AppHost deploys. Empty uses the lowercased aspire-environment, which is Aspire's default.
        type: string
        required: false
        default: ""
      rollout-timeout:
        description: Helm duration (15m, 900s, 1h30m) for the deploy wait, the rollback wait, and the schema rollback Job.
        type: string
        required: false
        default: 15m
      rollback-on-failure:
        description: Rolls the release back to its last deployed revision when the deployment fails. The job fails either way.
        type: boolean
        required: false
        default: true
      exclusive:
        description: Stops every workload of the release before deploying, causing downtime. For releases whose schema change the previous version cannot tolerate; the deploy step then receives ARKANIS_DEPLOY_EXCLUSIVE=true.
        type: boolean
        required: false
        default: false
      schema-rollback-cronjob:
        description: Suspended CronJob in the chart, as a Helm pre-install,pre-upgrade hook or an ordinary resource, whose Job undoes the failed release's schema changes after a rollback. Skipped when absent; empty disables it.
        type: string
        required: false
        default: schema-rollback
      schema-confirm-cronjob:
        description: Suspended CronJob in the chart whose Job records that this release's rollout was verified, run only after a verified deployment once no object in the namespace carries an older release's images. Skipped when absent; empty disables it.
        type: string
        required: false
        default: schema-confirm
      timeout-minutes:
        description: Deployment job timeout. Keep it above twice rollout-timeout plus build time so a rollback is never cancelled.
        type: number
        required: false
        default: 60
      artifact-retention-days:
        description: Deployment artifact retention in days.
        type: number
        required: false
        default: 30
      upload-diagnostics:
        description: Uploads the deploy report artifact, including failure diagnostics, when true. The upload is best-effort and never fails the job.
        type: boolean
        required: false
        default: true
    secrets:
      KUBE_CONFIG:
        description: Optional kubeconfig content written to RUNNER_TEMP.
        required: false
      NUGET_AUTH_JSON:
        description: Optional JSON credentials for private NuGet package sources used during restore.
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        description: Optional 1Password service account token used when NUGET_AUTH_JSON contains op:// references.
        required: false
    outputs:
      artifact-manifest:
        description: Path to the generated artifact manifest.
        value: ${{ jobs.deploy.outputs.artifact-manifest }}
      outcome:
        description: deployed, rolled-back, rollback-failed, failed-no-previous-release, failed-release-unchanged, failed-rollback-disabled, failed-exclusive-stop, cancelled, or not-attempted.
        value: ${{ jobs.deploy.outputs.outcome }}
      helm-release:
        description: Helm release that was deployed.
        value: ${{ jobs.deploy.outputs.helm-release }}
      previous-revision:
        description: Release revision before the deployment; empty on a first install.
        value: ${{ jobs.deploy.outputs.previous-revision }}
      new-revision:
        description: Release revision this deployment created; empty when Helm created none.
        value: ${{ jobs.deploy.outputs.new-revision }}
      current-revision:
        description: Release revision that is live when the job ends; differs from new-revision after a rollback.
        value: ${{ jobs.deploy.outputs.current-revision }}
      schema-rollback:
        description: Schema rollback hook result - not-run, not-configured, not-found, skipped, succeeded, failed, or timed-out.
        value: ${{ jobs.deploy.outputs.schema-rollback }}
      schema-confirm:
        description: Schema confirm hook result - not-run, not-configured, not-found, blocked, succeeded, failed, or timed-out.
        value: ${{ jobs.deploy.outputs.schema-confirm }}
      failed-resources:
        description: Comma-separated Deployments and pods that were not ready when the deployment failed.
        value: ${{ jobs.deploy.outputs.failed-resources }}

permissions: {}

jobs:
  deploy:
    name: ${{ inputs.image-tag || inputs.kubernetes-namespace }} @ ${{ inputs.environment-name }}
    runs-on: ${{ fromJSON(inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest'))) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: deploy-k8s-${{ inputs.environment-name }}-${{ inputs.kubernetes-namespace }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-manifest: ${{ steps.manifest.outputs.path }}
      outcome: ${{ steps.guard.outputs.outcome || 'not-attempted' }}
      helm-release: ${{ steps.guard.outputs.helm-release || steps.release-state.outputs.helm-release }}
      previous-revision: ${{ steps.guard.outputs.previous-revision || steps.release-state.outputs.previous-revision }}
      new-revision: ${{ steps.guard.outputs.new-revision }}
      current-revision: ${{ steps.guard.outputs.current-revision }}
      schema-rollback: ${{ steps.guard.outputs.schema-rollback }}
      schema-confirm: ${{ steps.guard.outputs.schema-confirm || 'not-run' }}
      failed-resources: ${{ steps.guard.outputs.failed-resources }}
    defaults:
      run:
        shell: bash
    env:
      HAS_KUBE_CONFIG: ${{ secrets.KUBE_CONFIG != '' }}
      NUGET_AUTH_JSON_PRESENT: ${{ secrets.NUGET_AUTH_JSON != '' }}
      OP_SERVICE_ACCOUNT_TOKEN_PRESENT: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
    steps:
      - name: Login to GitHub Container Registry @ ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Checkout caller @ ${{ github.repository }}:${{ inputs.source-ref || github.head_ref || github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Setup .NET @ ${{ inputs.global-json-file || inputs.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          global-json-file: ${{ inputs.global-json-file }}

      - name: Checkout platform actions @ ${{ fromJSON(toJSON(job)).workflow_repository }}:${{ fromJSON(toJSON(job)).workflow_sha }}
        uses: actions/checkout@v7
        with:
          # fromJSON(toJSON(job)) is only there because our pinned actionlint:1.7.12 does not know the newer documented job.workflow_ref / job.workflow_sha fields.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .ci/arkanis-ci
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-nuget-auth
            .github/actions/helm-release-guard
          sparse-checkout-cone-mode: false

      - name: Prepare private NuGet auth references
        id: nuget-auth-prepare
        if: env.NUGET_AUTH_JSON_PRESENT == 'true' || inputs.github-packages-auth
        uses: ./.ci/arkanis-ci/.github/actions/setup-nuget-auth
        env:
          GITHUB_TOKEN_FOR_NUGET_AUTH: ${{ github.token }}
        with:
          nuget-auth-json: ${{ secrets.NUGET_AUTH_JSON }}
          github-packages-auth: ${{ inputs.github-packages-auth }}
          source-config-path: ${{ inputs.nuget-source-config-path }}
          phase: prepare
          op-env-file: ${{ runner.temp }}/nuget-auth/op.env
          op-map-file: ${{ runner.temp }}/nuget-auth/op-map.json

      - name: Require private NuGet 1Password token
        if: steps.nuget-auth-prepare.outputs.op-required == 'true' && env.OP_SERVICE_ACCOUNT_TOKEN_PRESENT != 'true'
        run: |
          echo "::error::OP_SERVICE_ACCOUNT_TOKEN is required when NUGET_AUTH_JSON contains op:// references."
          exit 2

      - name: Load private NuGet auth values from 1Password
        if: steps.nuget-auth-prepare.outputs.op-required == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: ${{ steps.nuget-auth-prepare.outputs.op-env-file }}

      - name: Apply private NuGet auth credentials
        id: nuget-auth
        if: env.NUGET_AUTH_JSON_PRESENT == 'true' || inputs.github-packages-auth
        uses: ./.ci/arkanis-ci/.github/actions/setup-nuget-auth
        env:
          GITHUB_TOKEN_FOR_NUGET_AUTH: ${{ github.token }}
        with:
          nuget-auth-json: ${{ secrets.NUGET_AUTH_JSON }}
          github-packages-auth: ${{ inputs.github-packages-auth }}
          source-config-path: ${{ inputs.nuget-source-config-path }}
          phase: apply
          credential-mode: env
          host-config-path: ${{ runner.temp }}/nuget-auth/host.NuGet.Config
          op-map-file: ${{ steps.nuget-auth-prepare.outputs.op-map-file }}

      # Runners that keep NuGet's default packages folder on persistent disk advertise it with
      # ARKANIS_PERSISTENT_NUGET_PACKAGES=true (daedalus, ARK-528); the cache would only re-download
      # what is already there, and re-upload it from every parallel job after a key change. The
      # runner's own environment is not in the `env` expression context, hence a shell step, and
      # it is only consulted on self-hosted runners (docs/runner-contract.md).
      - name: Detect persistent NuGet folder @ ${{ runner.os }}-${{ runner.arch }}
        id: nuget-folder
        env:
          RUNS_ON_SELF_HOSTED: ${{ inputs.runs-on-self-hosted }}
        run: |
          if [[ "$RUNS_ON_SELF_HOSTED" == "true" && "${ARKANIS_PERSISTENT_NUGET_PACKAGES:-}" == "true" && -z "${NUGET_PACKAGES:-}" ]]; then
            echo "persistent=true" >> "$GITHUB_OUTPUT"
            echo "Runner keeps NuGet's default packages folder on persistent disk; skipping the NuGet cache."
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi

      # `~/.nuget/packages`, NuGet's own default folder, rather than a workspace path: the cache
      # `version` is a hash of this literal string, and a workspace path expands to a different
      # literal on every daedalus replica, which splits the cache into one namespace per replica
      # (ARK-502). The tilde is expanded later, at save and restore time.
      - name: Cache NuGet packages @ ${{ runner.os }}-${{ runner.arch }}
        if: inputs.enable-cache && steps.nuget-folder.outputs.persistent != 'true'
        uses: runs-on/cache@v5.0.7
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore local .NET tools @ .config/dotnet-tools.json
        run: |
          config_args=()
          if [[ -n "${RestoreConfigFile:-}" ]]; then config_args=(--configfile "$RestoreConfigFile"); fi
          dotnet tool restore "${config_args[@]}" || (echo "First dotnet tool restore failed; retrying once." && dotnet tool restore "${config_args[@]}")

      - name: Setup kubectl @ ${{ inputs.kubectl-version }}
        uses: azure/setup-kubectl@v5.2.0
        with:
          version: ${{ inputs.kubectl-version }}

      - name: Setup Helm @ ${{ inputs.helm-version }}
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Validate runner contract @ ${{ inputs.runs-on-json || inputs.runs-on || 'ubuntu-latest' }}
        env:
          RUNS_ON_SELF_HOSTED: ${{ inputs.runs-on-self-hosted }}
          RUNS_ON_JSON: ${{ inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest')) }}
          ENABLE_CACHE: ${{ inputs.enable-cache }}
          NUGET_FOLDER_PERSISTENT: ${{ steps.nuget-folder.outputs.persistent }}
        run: |
          mkdir -p artifacts/meta
          {
            echo "Runs on self-hosted: ${RUNS_ON_SELF_HOSTED}"
            echo "Requested runner labels: ${RUNS_ON_JSON}"
            echo "NuGet cache enabled: ${ENABLE_CACHE}"
            echo "Persistent NuGet folder (cache skipped): ${NUGET_FOLDER_PERSISTENT}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner arch: ${RUNNER_ARCH}"
            dotnet --version
            kubectl version --client=true
            helm version --short
          } | tee artifacts/meta/runner-contract.txt

      - name: Self-hosted preflight @ ${{ inputs.runs-on-json || inputs.runs-on || 'ubuntu-latest' }}
        if: inputs.runs-on-self-hosted
        run: |
          {
            echo "## Self-hosted runner preflight"
            echo
            df -h .
            echo
            command -v dotnet
            command -v kubectl
            command -v helm
          } | tee artifacts/meta/self-hosted-preflight.txt

      - name: Configure kubeconfig @ ${{ inputs.environment-name }}
        if: env.HAS_KUBE_CONFIG == 'true'
        env:
          KUBE_CONFIG_SECRET: ${{ secrets.KUBE_CONFIG }}
        run: |
          kubeconfig_path="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "$KUBE_CONFIG_SECRET" > "$kubeconfig_path"
          chmod 600 "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Validate deployment inputs @ ${{ inputs.kubernetes-namespace }}
        env:
          KUBERNETES_NAMESPACE: ${{ inputs.kubernetes-namespace }}
          APPHOST_PROJECT: ${{ inputs.apphost-project }}
        run: |
          if [[ ! "$KUBERNETES_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "Invalid Kubernetes namespace: ${KUBERNETES_NAMESPACE}" >&2
            exit 2
          fi

          if [[ ! -f "$APPHOST_PROJECT" ]]; then
            echo "Aspire AppHost project was not found: ${APPHOST_PROJECT}" >&2
            exit 2
          fi

      - name: Ensure namespace @ ${{ inputs.kubernetes-namespace }}
        env:
          KUBERNETES_NAMESPACE: ${{ inputs.kubernetes-namespace }}
        run: |
          kubectl create namespace "$KUBERNETES_NAMESPACE" --dry-run=client -o yaml > namespace.yaml
          kubectl apply -f namespace.yaml

      # Before anything is deployed: record the release's revisions (the rollback target), roll back a release a
      # cancelled run left in a pending-* state, and fail closed when the release cannot be read at all.
      # With exclusive: true it then scales every Deployment of the release to 0 and waits until their pods are gone;
      # when that fails it restores the replica counts and fails, so the deploy step never runs.
      - name: Record release state @ ${{ inputs.helm-release-name || inputs.aspire-environment }}
        id: release-state
        uses: ./.ci/arkanis-ci/.github/actions/helm-release-guard
        with:
          phase: capture
          namespace: ${{ inputs.kubernetes-namespace }}
          aspire-environment: ${{ inputs.aspire-environment }}
          helm-release-name: ${{ inputs.helm-release-name }}
          rollout-timeout: ${{ inputs.rollout-timeout }}
          rollback-on-failure: ${{ inputs.rollback-on-failure }}
          exclusive: ${{ inputs.exclusive }}
          schema-rollback-cronjob: ${{ inputs.schema-rollback-cronjob }}
          report-directory: artifacts/deploy-report
          shim-record-path: ${{ runner.temp }}/helm-shim/upgrade-record
          job-timeout-minutes: ${{ inputs.timeout-minutes }}

      # No continue-on-error here, ever: this step failing is what fails the job, and the guard step below can
      # restore the environment but must never turn a failed deployment green.
      - name: Aspire deploy ${{ inputs.apphost-project }} @ ${{ inputs.aspire-environment }}
        id: deploy
        env:
          ASPIRE_ENVIRONMENT: ${{ inputs.aspire-environment }}
          APPHOST_PROJECT: ${{ inputs.apphost-project }}
          OUTPUT_PATH: ${{ inputs.output-path }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          ROLLOUT_TIMEOUT: ${{ inputs.rollout-timeout }}
          # True only when the caller asked for exclusive AND the capture step confirmed the release is stopped.
          DEPLOY_EXCLUSIVE: ${{ inputs.exclusive && steps.release-state.outputs.exclusive == 'true' }}
        run: |
          mkdir -p "${OUTPUT_PATH}/${ENVIRONMENT_NAME}"
          if [[ -n "$IMAGE_TAG" ]]; then
            export Kubernetes__Images__Tag="$IMAGE_TAG"
          fi

          # Consumer contract (docs/deployments.md): the AppHost reads this at publish time and lets the migrator apply
          # a migration marked breaking only when it is "true". A rolling deploy must never see it, not even empty.
          if [[ "$DEPLOY_EXCLUSIVE" == "true" ]]; then
            export ARKANIS_DEPLOY_EXCLUSIVE=true
            echo "Exclusive deployment: the previous version is stopped; ARKANIS_DEPLOY_EXCLUSIVE=true."
          fi

          # Aspire.Hosting.Kubernetes hardcodes `helm upgrade --install ... --wait` and accepts no extra arguments,
          # so Helm's 5m default --timeout would apply. The shim is first on PATH for this step only and appends
          # --timeout to `helm upgrade`; every other helm call passes through. Remove it once Aspire exposes the
          # Helm arguments (ARK-744).
          shim_dir="${RUNNER_TEMP}/helm-shim"
          mkdir -p "$shim_dir"
          ARKANIS_REAL_HELM="$(command -v helm)"
          install -m 0755 .ci/arkanis-ci/.github/actions/helm-release-guard/helm-timeout-shim.sh "${shim_dir}/helm"
          export ARKANIS_REAL_HELM
          export ARKANIS_HELM_UPGRADE_TIMEOUT="$ROLLOUT_TIMEOUT"
          export ARKANIS_HELM_SHIM_RECORD="${shim_dir}/upgrade-record"
          export PATH="${shim_dir}:${PATH}"

          dotnet tool run aspire -- deploy \
            --apphost "$APPHOST_PROJECT" \
            --output-path "${OUTPUT_PATH}/${ENVIRONMENT_NAME}" \
            --environment "$ASPIRE_ENVIRONMENT" \
            --non-interactive \
            --pipeline-log-level debug \
            --include-exception-details \
            --debug

      # Runs whatever the deploy step did. Success: verify every Deployment rollout, then run the schema-confirm hook
      # unless a trace of an older release is left. Failure: collect diagnostics, then roll back to the recorded
      # revision, run the schema-rollback hook, and verify again. It exits non-zero for every outcome but `deployed`
      # and `not-attempted`, and for a failed schema confirm, and must stay ahead of the kubeconfig removal below.
      - name: Verify or roll back release @ ${{ steps.release-state.outputs.helm-release || inputs.kubernetes-namespace }}
        id: guard
        if: ${{ always() && steps.release-state.outcome != 'skipped' }}
        uses: ./.ci/arkanis-ci/.github/actions/helm-release-guard
        with:
          phase: finalize
          deploy-outcome: ${{ steps.deploy.outcome }}
          namespace: ${{ inputs.kubernetes-namespace }}
          aspire-environment: ${{ inputs.aspire-environment }}
          helm-release-name: ${{ inputs.helm-release-name }}
          rollout-timeout: ${{ inputs.rollout-timeout }}
          rollback-on-failure: ${{ inputs.rollback-on-failure }}
          exclusive: ${{ inputs.exclusive }}
          schema-rollback-cronjob: ${{ inputs.schema-rollback-cronjob }}
          schema-confirm-cronjob: ${{ inputs.schema-confirm-cronjob }}
          report-directory: artifacts/deploy-report
          shim-record-path: ${{ runner.temp }}/helm-shim/upgrade-record

      - name: Clear private NuGet auth credentials
        if: always() && steps.nuget-auth.outputs.configured == 'true'
        uses: ./.ci/arkanis-ci/.github/actions/setup-nuget-auth
        with:
          phase: cleanup
          op-env-file: ${{ steps.nuget-auth-prepare.outputs.op-env-file }}
          op-map-file: ${{ steps.nuget-auth-prepare.outputs.op-map-file }}
          configured-source-names-json: ${{ steps.nuget-auth.outputs.source-names-json }}
          host-config-path: ${{ steps.nuget-auth.outputs.host-config-path }}

      - name: Remove temporary kubeconfig @ ${{ inputs.environment-name }}
        if: always() && env.HAS_KUBE_CONFIG == 'true'
        run: rm -f "${RUNNER_TEMP}/kubeconfig"

      - name: Write artifact manifest @ artifacts/artifact-manifest.json
        id: manifest
        if: always()
        env:
          RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
          OUTPUT_PATH: ${{ inputs.output-path }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: |
          mkdir -p artifacts
          cat > artifacts/artifact-manifest.json <<JSON
          {
            "schema": "ci-artifact-manifest/v1",
            "producer": {
              "repository": "${GITHUB_REPOSITORY}",
              "workflow": "wf-deploy-k8s-aspire",
              "run_id": "${GITHUB_RUN_ID}",
              "run_attempt": "${GITHUB_RUN_ATTEMPT}",
              "sha": "${GITHUB_SHA}",
              "job": "deploy"
            },
            "artifacts": [
              {
                "name": "${GITHUB_REPOSITORY#*/}-k8s-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
                "kind": "deploy-report",
                "paths": ["${OUTPUT_PATH}/${ENVIRONMENT_NAME}", "artifacts/deploy-report", "artifacts/artifact-manifest.json"],
                "retention_days": ${RETENTION_DAYS}
              }
            ]
          }
          JSON
          echo "path=artifacts/artifact-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Publish summary @ ${{ steps.manifest.outputs.path || github.run_id }}
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          ASPIRE_ENVIRONMENT: ${{ inputs.aspire-environment }}
          KUBERNETES_NAMESPACE: ${{ inputs.kubernetes-namespace }}
          DEPLOY_OUTCOME: ${{ steps.guard.outputs.outcome || 'not-attempted' }}
          HELM_RELEASE: ${{ steps.guard.outputs.helm-release || steps.release-state.outputs.helm-release }}
          PREVIOUS_REVISION: ${{ steps.guard.outputs.previous-revision || steps.release-state.outputs.previous-revision }}
          NEW_REVISION: ${{ steps.guard.outputs.new-revision }}
          CURRENT_REVISION: ${{ steps.guard.outputs.current-revision }}
          FAILED_RESOURCES: ${{ steps.guard.outputs.failed-resources }}
          SCHEMA_CONFIRM: ${{ steps.guard.outputs.schema-confirm || 'not-run' }}
          DEPLOY_MODE: ${{ inputs.exclusive && 'exclusive' || 'rolling' }}
          DOWNTIME_STARTED_AT: ${{ steps.guard.outputs.downtime-started-at }}
          DOWNTIME_ENDED_AT: ${{ steps.guard.outputs.downtime-ended-at }}
        run: |
          {
            echo "# Aspire Kubernetes deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runs on self-hosted | \`${{ inputs.runs-on-self-hosted }}\` |"
            echo "| Runner labels | \`${{ inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest')) }}\` |"
            echo "| Environment | \`${ENVIRONMENT_NAME}\` |"
            echo "| Aspire environment | \`${ASPIRE_ENVIRONMENT}\` |"
            echo "| Namespace | \`${KUBERNETES_NAMESPACE}\` |"
            echo "| Outcome | \`${DEPLOY_OUTCOME}\` |"
            echo "| Helm release | \`${HELM_RELEASE:-n/a}\` |"
            echo "| Revision before this deployment | \`${PREVIOUS_REVISION:-none}\` |"
            echo "| Revision this deployment created | \`${NEW_REVISION:-none}\` |"
            echo "| Revision live now | \`${CURRENT_REVISION:-n/a}\` |"
            echo "| Failed resources | \`${FAILED_RESOURCES:-none}\` |"
            echo "| Schema confirm | \`${SCHEMA_CONFIRM}\` |"
            echo "| Deploy mode | \`${DEPLOY_MODE}\` |"
            if [[ -n "$DOWNTIME_STARTED_AT" ]]; then
              echo "| Downtime | \`${DOWNTIME_STARTED_AT} to ${DOWNTIME_ENDED_AT:-not restored}\` |"
            fi
            echo "| Manifest | \`${{ steps.manifest.outputs.path }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment artifacts @ ${{ github.event.repository.name }}-k8s-${{ inputs.environment-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ always() && inputs.upload-diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-k8s-${{ inputs.environment-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.output-path }}/${{ inputs.environment-name }}
            artifacts/deploy-report
            artifacts/artifact-manifest.json
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}
