# Expected: static validation passes. Illustrative only; never run a deployment in selftests.
name: Aspire selected-source consumer fixture
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    uses: ArkanisCorporation/ci/.github/workflows/wf-verify-deploy-k8s-aspire.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      source-ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      apphost-project: src/AppHost/AppHost.csproj
      aspire-environment: Kubernetes-Production
      kubernetes-namespace: example-production
      image-tag: v1.2.3
  deploy:
    needs: verify
    uses: ArkanisCorporation/ci/.github/workflows/wf-deploy-k8s-aspire.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      source-ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      apphost-project: src/AppHost/AppHost.csproj
      aspire-environment: Kubernetes-Production
      kubernetes-namespace: example-production
      image-tag: v1.2.3
      environment-name: production
      # Optional. Omitting all four keeps the same behaviour: a failed deployment is rolled back and fails the job.
      helm-release-name: kubernetes-production
      rollout-timeout: 15m
      rollback-on-failure: true
      schema-rollback-cronjob: schema-rollback
  report:
    needs: deploy
    # The deploy job is failed for every outcome but `deployed`, so read its outputs with always().
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report deployment outcome @ ${{ needs.deploy.outputs.outcome }}
        env:
          OUTCOME: ${{ needs.deploy.outputs.outcome }}
          PREVIOUS_REVISION: ${{ needs.deploy.outputs.previous-revision }}
          NEW_REVISION: ${{ needs.deploy.outputs.new-revision }}
          FAILED_RESOURCES: ${{ needs.deploy.outputs.failed-resources }}
        run: echo "outcome=${OUTCOME} previous=${PREVIOUS_REVISION} new=${NEW_REVISION} failed=${FAILED_RESOURCES}"
